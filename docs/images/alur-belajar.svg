    <text x="18" y="69" class="label">Murid mencoba</text>
    <text x="18" y="96" class="detail">Kuis dan petunjuk</text>
  </g>
  <g transform="translate(678 22)">
    <rect width="302" height="122" rx="13" fill="#182434" stroke="#40536a"/>
    <text x="18" y="31" class="step" fill="#f0cf8c">03</text>
    <text x="18" y="69" class="label">Guru meninjau</text>
    <text x="18" y="96" class="detail">Pola jawaban kelas</text>
  </g>
  <path d="M330 82h14m-6-5 6 5-6 5M658 82h14m-6-5 6 5-6 5" fill="none" stroke="#7fa1b2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
